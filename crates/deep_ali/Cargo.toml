[package]
name = "deep_ali"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "DEEP-ALI and FRI scaffolding"
repository = "https://example.com/your/repo"

[features]
default    = ["mldsa-44"]
parallel = ["dep:rayon", "merkle/parallel"]
fri_bench_log = []
sha3-256   = ["hash/sha3-256",   "merkle/sha3-256",   "transcript/sha3-256"]
sha3-384   = ["hash/sha3-384",   "merkle/sha3-384",   "transcript/sha3-384"]
sha3-512   = ["hash/sha3-512",   "merkle/sha3-512",   "transcript/sha3-512"]
blake3-hash = ["hash/blake3-hash", "merkle/blake3-hash", "transcript/blake3-hash"]
# Forward the merkle leaf-compression accelerator (paper dual-hash, §III).
poseidon-accel = ["merkle/poseidon-accel"]

# ─── ML-DSA parameter set selection ──────────────────────────────────
# Exactly one of these MUST be enabled.  Selects the FIPS 204 §4 Table 1
# parameter set used by `ml_dsa::params` and downstream AIRs.
#
# - mldsa-44 → ML-DSA-44 (NIST PQ Level 1, λ_sig = 128 bits).
#              K=4, L=4, τ=39, β=78, γ_1=2¹⁷, γ_2=(q−1)/88, ω=80,
#              c̃ = 32 B; pk = 1312 B; sig = 2420 B.
# - mldsa-65 → ML-DSA-65 (NIST PQ Level 3, λ_sig = 192 bits).
#              K=6, L=5, τ=49, β=196, γ_1=2¹⁹, γ_2=(q−1)/32, ω=55,
#              c̃ = 48 B; pk = 1952 B; sig = 3293 B.
# - mldsa-87 → ML-DSA-87 (NIST PQ Level 5, λ_sig = 256 bits).
#              K=8, L=7, τ=60, β=120, γ_1=2¹⁹, γ_2=(q−1)/32, ω=75,
#              c̃ = 64 B; pk = 2592 B; sig = 4627 B.
#
# Pair with `sha3-256`/`sha3-384`/`sha3-512` for the matching STARK
# Merkle hash level.  The STARK level may be ≥ the signature level
# (over-provisioning is fine; under-provisioning is unsafe).
mldsa-44 = []
mldsa-65 = []
mldsa-87 = []

[dependencies]
ark-ff = { version = "0.4.2" }
ark-poly = "0.4.2"
ark-serialize = "0.4.2"
rand = { version = "0.8", features = ["std", "std_rng"] }
blake3 = "1.5"
once_cell = "1.19"
hex = "0.4"
rayon = { version = "1.10", optional = true }
serde_json = "1"
hash      = { path = "../hash",      default-features = false }
merkle    = { path = "../merkle",    default-features = false }
transcript = { path = "../transcript", default-features = false }
poseidon = { path = "../poseidon" }
ark-goldilocks = { path = "../ark-goldilocks" }
# Used by the rsa2048_* AIR modules ported from the stark-dns
# fork of deep_ali; ~2k-bit big-int arithmetic for the modulus
# and exponentiation chains.
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
# SHAKE-256 (FIPS 202) for the ML-DSA SampleInBall and ExpandA
# native references.  When the in-circuit Keccak AIR composes
# end-to-end, the consumers will move to in-circuit hashing and
# this dep can be relegated to dev only.
sha3 = "0.10"
# Wire-format compression for V2ProofReal — exploits the ~4×
# structural redundancy in F2b row openings (Merkle path sibling
# hashes are widely shared across K·N contiguous-stride openings
# per binding leg).  Empirically zstd -19 gives 4.0× compression on
# v2 proofs at L3, blowup=4 (48 MB → 12 MB).  Adds ~10-15 ms verify
# decompress time.  No structural changes to the proof.
zstd = "0.13"



[dev-dependencies]
ark-ff = "0.4.2"
ark-poly = "0.4.2"
ark-serialize = "0.4.2"
rand = { version = "0.8", features = ["std", "std_rng"] }
blake3 = "1.5"
once_cell = "1.19"
hex = "0.4"
sha2 = "0.10"
# Reference implementation for F_{2^255 - 19} arithmetic — used to
# cross-check the in-circuit `ed25519_field` gadget gadgets.
curve25519-dalek = "4.1"