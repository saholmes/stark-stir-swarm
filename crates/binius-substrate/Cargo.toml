# binius-substrate — M1 of the Binius port (STARK-Binius-SWARM).
#
# DELIBERATELY STANDALONE: this crate carries its own `[workspace]` table and
# `rust-toolchain.toml` so it is NOT a member of the parent stark-binius-swarm
# workspace.  Rationale: Binius pins nightly-2025-04-24 and pulls a large dep
# tree; keeping this spike detached leaves the sound-signature crates pristine
# on stable and out of Binius's dependency graph until the port is proven out.
#
# Goal (M1 "substrate up"): demonstrate that Binius's in-circuit Keccak-f gadget
# proves AND verifies with a SHA-256 (FIPS 180-4) Merkle commitment + SHA-256
# Fiat–Shamir challenger — i.e. the FIPS instantiation is real, with no
# Groestl/Vision/Poseidon on the soundness-critical path.

[package]
name = "binius-substrate"
version = "0.1.0"
edition = "2021"
publish = false

# Detach from the parent workspace (explicit empty workspace root).
[workspace]

[dependencies]
# Binius (local checkout, path deps — see rust-toolchain.toml for the pinned nightly).
binius_core     = { path = "../../../binius/crates/core" }
binius_field    = { path = "../../../binius/crates/field" }
binius_hash     = { path = "../../../binius/crates/hash" }
binius_m3       = { path = "../../../binius/crates/m3" }
binius_hal      = { path = "../../../binius/crates/hal" }
binius_circuits = { path = "../../../binius/crates/circuits" }
# Needed by the M3 (kappa_FS) B256 tower field: SerializeBytes/DeserializeBytes
# (Field super-traits) live in binius_utils; bytemuck/subtle for the local 256-bit
# underlier's UnderlierType super-traits. Versions pinned to Binius's Cargo.lock.
binius_utils    = { path = "../../../binius/crates/utils" }
bytemuck = { version = "1.18.0", features = ["derive", "min_const_generics"] }
subtle   = "2.5.0"

# External deps pinned to Binius's versions to avoid duplicate builds / trait mismatches.
anyhow  = "1.0.81"
bumpalo = { version = "3.16.0", features = ["collections"] }
rand    = { version = "0.8.5", default-features = false, features = ["std_rng"] }
# `compress` exposes sha2::{compress256, compress512}; binius_hash already enables
# this feature on the same sha2 version, so unifying it here adds no lock churn.
sha2    = { version = "0.10.8", features = ["compress"] }

[dev-dependencies]
# Native SHA3-256 reference (FIPS 202) used only by tests to gate the in-circuit
# sponge against NIST vectors. Version pinned to Binius's Cargo.lock (0.10.8) to
# avoid any transitive lock churn.
sha3    = "0.10.8"
# Independent native Keccak-f[1600] reference for the B256 in-circuit gadget's
# `keccak_b256_matches_native` gate (test-only; isolated to this detached crate's lock).
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
