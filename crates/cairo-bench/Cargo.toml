[package]
name = "cairo-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Criterion benchmarks for all Cairo AIR workloads on the STARK/DEEP-ALI/FRI prover"

[features]
default  = ["sha3-256", "parallel", "mldsa-44"]
sha3-256 = ["deep_ali/sha3-256"]
sha3-384 = ["deep_ali/sha3-384"]
sha3-512 = ["deep_ali/sha3-512"]
mldsa-44 = ["deep_ali/mldsa-44"]
mldsa-65 = ["deep_ali/mldsa-65"]
mldsa-87 = ["deep_ali/mldsa-87"]
parallel = ["deep_ali/parallel"]
# Optional Poseidon-accelerated leaf compression (paper dual-hash).
poseidon-accel = ["deep_ali/poseidon-accel"]
# Enable to run real Cairo 0 programs via the LambdaClass cairo-vm crate.
# Requires: cargo add cairo-vm (or add below), plus cairo-compile to build .json programs.
cairo-vm-trace = ["dep:cairo-vm"]

[dependencies]
ark-ff = { workspace = true }
ark-goldilocks = { workspace = true }
ark-poly = { workspace = true }
rand = { workspace = true }
rayon = "1.10"
sha3 = { workspace = true }
hex = "0.4"
fips204 = { workspace = true }

# default-features = false so that the bench harness can pick the
# (sha3-N, mldsa-N) pair via `cargo run --features "deep_ali/sha3-384
# deep_ali/mldsa-65 deep_ali/parallel" --no-default-features` without
# `mldsa-44` from `deep_ali`'s own default leaking in and triggering
# the "cannot enable both `mldsa-44` and `mldsa-N`" compile_error.
deep_ali    = { path = "../deep_ali", default-features = false }
hash        = { path = "../hash",       default-features = false }
merkle      = { path = "../merkle",     default-features = false }
transcript  = { path = "../transcript", default-features = false }

# Real Cairo 0 VM trace extraction (optional).
cairo-vm = { version = "1", features = ["std", "cairo-1-hints"], optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "cairo_air_bench"
harness = false
