[package]
name = "swarm-dns"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "DNS-rollup record helpers, authority signing layer, and the megazone demo for the STIR swarm"

[features]
default  = ["sha3-256", "mldsa-44", "parallel"]
sha3-256 = ["deep_ali/sha3-256", "wrapper-stark/sha3-256", "cairo-bench/sha3-256"]
sha3-384 = ["deep_ali/sha3-384", "wrapper-stark/sha3-384", "cairo-bench/sha3-384"]
sha3-512 = ["deep_ali/sha3-512", "wrapper-stark/sha3-512", "cairo-bench/sha3-512"]
mldsa-44 = ["deep_ali/mldsa-44", "wrapper-stark/mldsa-44", "cairo-bench/mldsa-44"]
mldsa-65 = ["deep_ali/mldsa-65", "wrapper-stark/mldsa-65", "cairo-bench/mldsa-65"]
mldsa-87 = ["deep_ali/mldsa-87", "wrapper-stark/mldsa-87", "cairo-bench/mldsa-87"]
parallel = ["deep_ali/parallel", "wrapper-stark/parallel", "cairo-bench/parallel"]
# Forward the merkle leaf-compression accelerator (paper dual-hash §8):
# Poseidon-compresses field-element leaves, then SHA-3 the state for the
# verifier-facing leaf hash.  Internal Merkle nodes remain SHA-3 only —
# verifier-path soundness is unchanged (SHA-3 CR + FRI IT).
poseidon-accel = ["deep_ali/poseidon-accel"]

[dependencies]
ark-ff         = { workspace = true }
ark-goldilocks = { workspace = true }
ark-serialize  = { workspace = true }
rand           = { workspace = true }
rayon          = "1.10"
sha3           = { workspace = true }
hex            = "0.4"
fips204        = { workspace = true }
serde          = { workspace = true, features = ["derive"] }

deep_ali    = { path = "../deep_ali", default-features = false }
cairo-bench = { path = "../cairo-bench", default-features = false }   # for AirType::HashRollup + trace builders
hash        = { path = "../hash",       default-features = false }
merkle      = { path = "../merkle",     default-features = false }
transcript  = { path = "../transcript", default-features = false }

# wrapper-stark: pulled in by the ml_dsa_recursive_rollup_demo example
# to produce recursive STARK proofs.  Features are forwarded from
# swarm-dns's own (sha3-*, mldsa-*) selection so the workspace builds
# at any valid (level, quantum-q) combination consistently.
wrapper-stark = { path = "../wrapper-stark", default-features = false }

[dev-dependencies]
num-bigint    = "0.4"
sha2          = "0.10"
# Per-thread heap allocator for the K=256 STARK calibration example.
# macOS's libsystem_malloc serialises threads on a global lock for
# medium-sized (~600 KB) allocations like the per-iteration cvals
# Vec<F> in deep_ali_merge_ed25519_verify; mimalloc has per-thread
# heaps and removes that contention.  Used only via #[global_allocator]
# in the calibration example, not on the production verifier path.
mimalloc      = "0.1"
# Used by examples/zsk_ksk_bench for synthetic key/signature generation
# and as a runtime baseline.  Not on the runtime verification path —
# `verify_zsk_ksk_runtime_fallback` uses only `deep_ali`.
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
